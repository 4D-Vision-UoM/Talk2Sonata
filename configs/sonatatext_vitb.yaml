model:
  type: SonataText
  sonata_model_name: sonata
  sonata_repo_id: facebook/sonata
  clip_model_name: ViT-B/16
  freeze_sonata: true
  freeze_clip: true
  device: cuda
  
  projection:
    sonata_embed_dim: 512
    clip_embed_dim: 512
    hidden_layer: true
    act: tanh
    cosine: true

train:
  lr: 0.0001
  batch_size: 32
  num_epochs: 100
  loss_type: infonce
  optimizer: adam
  weight_decay: 0.0001
  lr_scheduler: cosine
  warmup_epochs: 10

data:
  dataset: scannet
  num_points: 8192
  augmentation: true
